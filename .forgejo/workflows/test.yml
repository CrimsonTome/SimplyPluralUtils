on: [push]
jobs:
  test:
    runs-on: docker
    container:
        image: debian:stable-slim
    steps:
      - name: install dependencies
        run: apt-get update -y >/dev/null && apt-get install -y curl nodejs> /dev/null
      - name: checkout code
        uses: actions/checkout@v3
        with:
          repository: 'crimsontome/SimplyPluralUtils'
      - name: install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          run: . "$HOME/.local/bin/env"
      - name: ruff formatting 
        run: | 
          uvx ruff check --fix 
          uvx ruff format
