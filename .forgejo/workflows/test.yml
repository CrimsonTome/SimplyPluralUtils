on: [push]
jobs:
  test:
    runs-on: docker
    container:
        image: debian:stable-slim
    steps:
      - run: apt update -y && apt install -y curl
      - run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - run: . "$HOME/.local/bin/env"
      - run: uvx ruff check --fix
      - run: uvx ruff format
